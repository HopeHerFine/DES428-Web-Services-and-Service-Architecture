events {}
http {
  resolver 127.0.0.11 valid=10s ipv6=off;
  map $http_authorization $notification_authorization {
    "" "Bearer $cookie_notifications_token";
    default $http_authorization;
  }
  map $http_x_request_id $correlation_id {
    default $request_id;
    "~^[a-zA-Z0-9_-]{1,128}$" $http_x_request_id;
  }
  map $http_origin $allowed_origin {
    default 0;
    "" 1;
    "http://localhost:8080" 1;
  }
  map "$request_method:$allowed_origin" $reject_origin {
    default 0;
    ~^(POST|PUT|PATCH|DELETE):0$ 1;
  }
  log_format structured escape=json '{"service":"gateway","correlation_id":"$correlation_id","method":"$request_method","uri":"$uri","origin":"$http_origin","status":$status,"upstream_status":"$upstream_status","duration":$request_time}';
  access_log /dev/stdout structured;
  server {
    listen 80;
    server_name localhost;
    if ($host = 127.0.0.1) { return 308 http://localhost:8080$request_uri; }
    add_header X-Request-Id $correlation_id always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port 8080;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Request-Id $correlation_id;
    proxy_connect_timeout 5s;
    proxy_read_timeout 30s;
    set $monolith http://edemand:3000;
    set $notifications http://notifications:8000;
    set $identity http://keycloak:8080;
    location = /gateway-health { access_log off; return 200 'ok'; }
    # Scrape endpoints are available only on the internal Docker network.
    location = /api/metrics { return 404; }
    location = /metrics { return 404; }
    # Keycloak owns its login-action/session/CSRF validation. Do not apply the
    # application's API Origin policy to the identity provider's form posts.
    location /auth/ { proxy_pass $identity$request_uri; }
    location ~ ^/api/notifications(?:/|$) {
      if ($reject_origin) { return 403; }
      # Repeating these inherited headers is required because this location
      # defines its own proxy_set_header directives.
      proxy_set_header Host $http_host;
      proxy_set_header X-Request-Id $correlation_id;
      proxy_set_header Authorization $notification_authorization;
      proxy_pass $notifications$request_uri;
    }
    location = /notification-docs { proxy_pass $notifications/docs; }
    location = /openapi.json { proxy_pass $notifications/openapi.json; }
    location /api/ {
      if ($reject_origin) { return 403; }
      proxy_pass $monolith$request_uri;
    }
    location / { proxy_pass $monolith$request_uri; }
  }
}
