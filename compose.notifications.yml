# Development stack for the new service only. The original monolith stays unchanged.
# Required: copy services/notifications/.env.example to .env.notifications and fill values.
# docker compose --env-file .env.notifications -f compose.notifications.yml up --build
name: homeservice-notifications
x-notification-environment: &notification-environment
  DATABASE_URL: postgresql+psycopg://notifications:${NOTIFICATIONS_DB_PASSWORD:?set database password}@notifications-db:5432/notifications
  JWT_ISSUER: ${JWT_ISSUER:?set Keycloak realm issuer}
  JWT_AUDIENCE: notifications
  JWT_JWKS_URL: ${JWT_JWKS_URL:?set reachable Keycloak JWKS URL}
  RABBITMQ_URL: amqp://notifications:${RABBITMQ_PASSWORD:?set broker password}@rabbitmq:5672/%2F
services:
  keycloak-config:
    profiles: [identity-config]
    build: ./services/notifications
    environment:
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run start-notifications.ps1}
    command: [python, -m, app.configure_keycloak]
  keycloak:
    profiles: [migration]
    image: quay.io/keycloak/keycloak:26.8.2
    command: [start-dev, --import-realm]
    environment:
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: http://localhost:8080/auth
      KC_PROXY_HEADERS: xforwarded
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?run start-notifications.ps1 to create local password}
      JAVA_OPTS_KC_HEAP: -Xms128m -Xmx512m
    volumes:
      - ./keycloak/homeservice-realm.json:/opt/keycloak/data/import/homeservice-realm.json:ro
      - keycloak-data:/opt/keycloak/data
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf "GET /auth/realms/homeservice HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; IFS= read -r line <&3; [[ "$$line" == *"200"* ]]'
      start_period: 90s
      interval: 10s
      timeout: 5s
      retries: 30
  gateway:
    profiles: [migration]
    image: nginx:1.28-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      edemand:
        condition: service_healthy
      notifications:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, --header, "Host: localhost", -O, /dev/null, http://127.0.0.1/gateway-health]
      interval: 10s
      timeout: 3s
      retries: 10
  edemand:
    profiles: [migration]
    build:
      context: .
      target: runtime
    environment:
      EXTERNAL_NOTIFICATIONS: 'true'
      RABBITMQ_URL: amqp://notifications:${RABBITMQ_PASSWORD:?set broker password}@rabbitmq:5672/%2F
      DB_PATH: /app/data/edemand.db
      JWT_SECRET: ${JWT_SECRET:?run start-notifications.ps1 to create session secret}
      JWT_ISSUER: ${JWT_ISSUER}
      PUBLIC_ORIGIN: http://localhost:8080
      OIDC_INTERNAL_BASE: http://keycloak:8080/auth/realms/homeservice
      NOTIFICATIONS_SERVICE_URL: http://gateway/api/notifications
    volumes:
      - monolith-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 20
  notifications-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifications
      POSTGRES_USER: notifications
      POSTGRES_PASSWORD: ${NOTIFICATIONS_DB_PASSWORD:?set database password}
    volumes:
      - notifications-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U notifications -d notifications"]
      interval: 5s
      timeout: 3s
      retries: 20
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: notifications
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set broker password}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 10s
      timeout: 5s
      retries: 20
  notifications:
    build: ./services/notifications
    environment: *notification-environment
    depends_on:
      notifications-db:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 10
  notifications-worker:
    build: ./services/notifications
    environment: *notification-environment
    command: [python, -m, app.worker]
    restart: on-failure
    depends_on:
      notifications:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
volumes:
  keycloak-data:
  monolith-data:
  notifications-data:
  rabbitmq-data:
