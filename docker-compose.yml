{
  "name": "homeservice-notifications",
  "networks": {
    "default": {
      "ipam": {}
    }
  },
  "services": {
    "broker-recovery": {
      "profiles": [
        "checks"
      ],
      "command": [
        "python",
        "-m",
        "app.broker_recovery",
        "prepare"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh"
      ],
      "environment": {
        "JWT_AUDIENCE": "notifications",
        "JWT_ISSUER": "http://localhost:8080/auth/realms/homeservice",
        "JWT_JWKS_URL": "http://keycloak:8080/auth/realms/homeservice/protocol/openid-connect/certs",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://jaeger:4318"
      },
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./runtime/probes",
          "target": "/probe-data",
          "bind": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "broker-recovery",
            "nocopy": true
          }
        }
      ],
      "build": {
        "context": "./services/notifications",
        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "edemand": {
      "command": [
        "node",
        "server.js"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh"
      ],
      "environment": {
        "DB_PATH": "/app/data/edemand.db",
        "EXTERNAL_NOTIFICATIONS": "true",
        "JWT_ISSUER": "http://localhost:8080/auth/realms/homeservice",
        "NOTIFICATIONS_SERVICE_URL": "http://gateway/api/notifications",
        "OIDC_INTERNAL_BASE": "http://keycloak:8080/auth/realms/homeservice",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://jaeger:4318",
        "PUBLIC_ORIGIN": "http://localhost:8080"
      },
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "volume",
          "source": "monolith-data",
          "target": "/app/data",
          "volume": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "edemand",
            "nocopy": true
          }
        }
      ],
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "runtime"
      },
      "depends_on": {
        "keycloak": {
          "condition": "service_healthy",
          "required": true
        },
        "rabbitmq": {
          "condition": "service_healthy",
          "required": true
        },
        "bootstrap": {
          "condition": "service_completed_successfully"
        },
        "keycloak-config": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/api/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ],
        "timeout": "5s",
        "interval": "10s",
        "retries": 20,
        "start_period": "30s"
      }
    },
    "gateway": {
      "command": null,
      "entrypoint": null,
      "image": "nginx:1.28-alpine",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./gateway/nginx.conf",
          "target": "/etc/nginx/nginx.conf",
          "read_only": true,
          "bind": {}
        }
      ],
      "depends_on": {
        "edemand": {
          "condition": "service_healthy",
          "required": true
        },
        "keycloak": {
          "condition": "service_healthy",
          "required": true
        },
        "notifications": {
          "condition": "service_healthy",
          "required": true
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "wget",
          "-q",
          "--header",
          "Host: localhost",
          "-O",
          "/dev/null",
          "http://127.0.0.1/gateway-health"
        ],
        "timeout": "3s",
        "interval": "10s",
        "retries": 10
      },
      "ports": [
        {
          "mode": "ingress",
          "host_ip": "127.0.0.1",
          "target": 80,
          "published": "8080",
          "protocol": "tcp"
        }
      ]
    },
    "grafana": {
      "command": null,
      "entrypoint": null,
      "environment": {
        "GF_AUTH_ANONYMOUS_ENABLED": "true",
        "GF_AUTH_ANONYMOUS_ORG_ROLE": "Viewer",
        "GF_AUTH_DISABLE_LOGIN_FORM": "true",
        "GF_USERS_ALLOW_SIGN_UP": "false"
      },
      "image": "grafana/grafana:11.6.0",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./observability/grafana",
          "target": "/etc/grafana/provisioning",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "volume",
          "source": "grafana-data",
          "target": "/var/lib/grafana",
          "volume": {}
        }
      ],
      "ports": [
        {
          "mode": "ingress",
          "host_ip": "127.0.0.1",
          "target": 3000,
          "published": "3000",
          "protocol": "tcp"
        }
      ]
    },
    "jaeger": {
      "command": null,
      "entrypoint": null,
      "environment": {
        "COLLECTOR_OTLP_ENABLED": "true",
        "MEMORY_MAX_TRACES": "5000"
      },
      "image": "jaegertracing/all-in-one:1.64.0",
      "networks": {
        "default": null
      },
      "ports": [
        {
          "mode": "ingress",
          "host_ip": "127.0.0.1",
          "target": 16686,
          "published": "16686",
          "protocol": "tcp"
        }
      ]
    },
    "keycloak": {
      "command": [
        "start-dev",
        "--import-realm"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh",
        "/opt/keycloak/bin/kc.sh"
      ],
      "environment": {
        "JAVA_OPTS_KC_HEAP": "-Xms128m -Xmx512m",
        "KC_BOOTSTRAP_ADMIN_USERNAME": "admin",
        "KC_HOSTNAME": "http://localhost:8080/auth",
        "KC_HTTP_RELATIVE_PATH": "/auth",
        "KC_PROXY_HEADERS": "xforwarded"
      },
      "image": "quay.io/keycloak/keycloak:26.8.2",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./keycloak/homeservice-realm.json",
          "target": "/opt/keycloak/data/import/homeservice-realm.json",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "volume",
          "source": "keycloak-data",
          "target": "/opt/keycloak/data",
          "volume": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "keycloak",
            "nocopy": true
          }
        }
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8080; printf \"GET /auth/realms/homeservice HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3; IFS= read -r line <&3; [[ \"$$line\" == *\"200\"* ]]'"
        ],
        "timeout": "5s",
        "interval": "10s",
        "retries": 30,
        "start_period": "1m30s"
      },
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "keycloak-config": {
      "command": [
        "python",
        "-m",
        "app.configure_keycloak"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh"
      ],
      "environment": {},
      "networks": {
        "default": null
      },
      "build": {
        "context": "./services/notifications",
        "dockerfile": "Dockerfile"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "keycloak-config",
            "nocopy": true
          }
        }
      ],
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        },
        "keycloak": {
          "condition": "service_healthy"
        }
      }
    },
    "legacy-export": {
      "profiles": [
        "checks"
      ],
      "command": null,
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh",
        "node",
        "/app/export-legacy-notifications.mjs"
      ],
      "environment": {},
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "volume",
          "source": "monolith-data",
          "target": "/app/data",
          "read_only": true,
          "volume": {}
        },
        {
          "type": "bind",
          "source": "./scripts/export-legacy-notifications.mjs",
          "target": "/app/export-legacy-notifications.mjs",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "bind",
          "source": "./runtime/probes",
          "target": "/probe-data",
          "bind": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "legacy-export",
            "nocopy": true
          }
        }
      ],
      "build": {
        "context": ".",
        "dockerfile": "Dockerfile",
        "target": "runtime"
      },
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "notifications": {
      "command": [
        "uvicorn",
        "app.main:create_app",
        "--factory",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--log-level",
        "info"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh"
      ],
      "environment": {
        "JWT_AUDIENCE": "notifications",
        "JWT_ISSUER": "http://localhost:8080/auth/realms/homeservice",
        "JWT_JWKS_URL": "http://keycloak:8080/auth/realms/homeservice/protocol/openid-connect/certs",
        "NOTIFICATIONS_FAULT_FILE": "/faults/notifications.json",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://jaeger:4318"
      },
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./runtime/faults",
          "target": "/faults",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "notifications",
            "nocopy": true
          }
        }
      ],
      "build": {
        "context": "./services/notifications",
        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "notifications-db": {
          "condition": "service_healthy",
          "required": true
        },
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      },
      "healthcheck": {
        "test": [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"
        ],
        "timeout": "3s",
        "interval": "10s",
        "retries": 10
      }
    },
    "notifications-db": {
      "command": [
        "postgres"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh",
        "docker-entrypoint.sh"
      ],
      "environment": {
        "POSTGRES_DB": "notifications",
        "POSTGRES_USER": "notifications"
      },
      "image": "postgres:16-alpine",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "volume",
          "source": "notifications-data",
          "target": "/var/lib/postgresql/data",
          "volume": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "notifications-db",
            "nocopy": true
          }
        }
      ],
      "healthcheck": {
        "test": [
          "CMD-SHELL",
          "pg_isready -U notifications -d notifications"
        ],
        "timeout": "3s",
        "interval": "5s",
        "retries": 20
      },
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "notifications-worker": {
      "restart": "on-failure",
      "command": [
        "python",
        "-m",
        "app.worker"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh"
      ],
      "environment": {
        "JWT_AUDIENCE": "notifications",
        "JWT_ISSUER": "http://localhost:8080/auth/realms/homeservice",
        "JWT_JWKS_URL": "http://keycloak:8080/auth/realms/homeservice/protocol/openid-connect/certs",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://jaeger:4318"
      },
      "networks": {
        "default": null
      },
      "build": {
        "context": "./services/notifications",
        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "notifications": {
          "condition": "service_healthy",
          "required": true
        },
        "rabbitmq": {
          "condition": "service_healthy",
          "required": true
        },
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      },
      "volumes": [
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "notifications-worker",
            "nocopy": true
          }
        }
      ]
    },
    "prometheus": {
      "command": [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--storage.tsdb.retention.time=7d"
      ],
      "entrypoint": null,
      "image": "prom/prometheus:v3.2.1",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./observability/prometheus.yml",
          "target": "/etc/prometheus/prometheus.yml",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "volume",
          "source": "prometheus-data",
          "target": "/prometheus",
          "volume": {}
        }
      ],
      "ports": [
        {
          "mode": "ingress",
          "host_ip": "127.0.0.1",
          "target": 9090,
          "published": "9090",
          "protocol": "tcp"
        }
      ]
    },
    "rabbitmq": {
      "command": [
        "rabbitmq-server"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh",
        "docker-entrypoint.sh"
      ],
      "environment": {
        "RABBITMQ_DEFAULT_USER": "notifications"
      },
      "image": "rabbitmq:3.13-management-alpine",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "volume",
          "source": "rabbitmq-data",
          "target": "/var/lib/rabbitmq",
          "volume": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "rabbitmq",
            "nocopy": true
          }
        }
      ],
      "healthcheck": {
        "test": [
          "CMD",
          "rabbitmq-diagnostics",
          "-q",
          "ping"
        ],
        "timeout": "5s",
        "interval": "10s",
        "retries": 20
      },
      "ports": [
        {
          "mode": "ingress",
          "host_ip": "127.0.0.1",
          "target": 15672,
          "published": "15672",
          "protocol": "tcp"
        }
      ],
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "resilience-fixture": {
      "profiles": [
        "checks"
      ],
      "command": [
        "python",
        "-m",
        "app.resilience_fixture",
        "prepare"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh"
      ],
      "environment": {
        "JWT_AUDIENCE": "notifications",
        "JWT_ISSUER": "http://localhost:8080/auth/realms/homeservice",
        "JWT_JWKS_URL": "http://keycloak:8080/auth/realms/homeservice/protocol/openid-connect/certs",
        "OTEL_EXPORTER_OTLP_ENDPOINT": "http://jaeger:4318"
      },
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./runtime/probes",
          "target": "/probe-data",
          "bind": {}
        },
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "resilience-fixture",
            "nocopy": true
          }
        }
      ],
      "build": {
        "context": "./services/notifications",
        "dockerfile": "Dockerfile"
      },
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "resilience-probe": {
      "profiles": [
        "checks"
      ],
      "command": [
        "node",
        "/probe/run.mjs"
      ],
      "entrypoint": null,
      "image": "node:20-slim",
      "networks": {
        "default": null
      },
      "volumes": [
        {
          "type": "bind",
          "source": "./scripts/resilience-probe.mjs",
          "target": "/probe/run.mjs",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "bind",
          "source": "./lib/http/retry.js",
          "target": "/probe/retry.mjs",
          "read_only": true,
          "bind": {}
        },
        {
          "type": "bind",
          "source": "./runtime/probes",
          "target": "/probe-data",
          "bind": {}
        },
        {
          "type": "bind",
          "source": "./runtime/faults",
          "target": "/faults",
          "bind": {}
        }
      ],
      "working_dir": "/probe"
    },
    "security-probe": {
      "profiles": [
        "identity-config"
      ],
      "command": [
        "python",
        "-m",
        "app.security_probe"
      ],
      "entrypoint": [
        "/bin/sh",
        "/run/local-env/launch.sh"
      ],
      "environment": {},
      "networks": {
        "default": null
      },
      "build": {
        "context": "./services/notifications",
        "dockerfile": "Dockerfile"
      },
      "volumes": [
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/run/local-env",
          "read_only": true,
          "volume": {
            "subpath": "security-probe",
            "nocopy": true
          }
        }
      ],
      "depends_on": {
        "bootstrap": {
          "condition": "service_completed_successfully"
        }
      }
    },
    "bootstrap": {
      "build": {
        "context": "./services/notifications"
      },
      "command": [
        "python",
        "-m",
        "app.bootstrap_stack"
      ],
      "env_file": [
        {
          "path": ".env.notifications",
          "required": false
        }
      ],
      "network_mode": "none",
      "cap_drop": [
        "ALL"
      ],
      "security_opt": [
        "no-new-privileges:true"
      ],
      "volumes": [
        {
          "type": "volume",
          "source": "stack-config",
          "target": "/bootstrap"
        }
      ]
    }
  },
  "volumes": {
    "grafana-data": {},
    "keycloak-data": {},
    "monolith-data": {},
    "notifications-data": {},
    "prometheus-data": {},
    "rabbitmq-data": {},
    "stack-config": {}
  }
}
