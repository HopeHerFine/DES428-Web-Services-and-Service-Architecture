name: Notifications checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  payments:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: payments_test
          POSTGRES_USER: payments_test
          POSTGRES_PASSWORD: disposable-ci-fixture
        ports: ['5433:5432']
        options: >-
          --health-cmd "pg_isready -U payments_test -d payments_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r services/payments/requirements-dev.txt
      - name: Test Payments on real PostgreSQL including concurrent writes
        working-directory: services/payments
        env:
          PAYMENTS_TEST_DATABASE_URL: postgresql+psycopg://payments_test:disposable-ci-fixture@localhost:5433/payments_test
        run: python -m pytest tests -q
      - name: Exercise browser payment, duplicate clicks, remote wallet and refund
        run: sh scripts/check-payments-ci.sh
  windows-transport:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify migration transport on Windows PowerShell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-history-transport.ps1
      - name: Verify probe transport on Windows PowerShell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-probe-transport.ps1
      - name: Verify clean source without Git
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-clean-source.ps1
      - name: Verify Docker memory measurement units
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-memory-parser.ps1
      - name: Verify memory sampler survives transient container exits
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-memory-sampler.ps1
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/notifications/requirements*.txt
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r services/notifications/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: services/notifications
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Pact with the documented Compose command
        run: docker compose -f compose.contracts.yml run --build --rm contract-tests
      - name: Require generated contracts for both service boundaries
        run: |
          test -s runtime/contracts/pacts/HomeserviceWeb-Notifications.json
          test -s runtime/contracts/pacts/HomeserviceWeb-Payments.json
      - name: Contract service logs
        if: failure()
        run: docker compose -f compose.contracts.yml logs --no-color --tail 100
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: homeservice-pacts
          path: runtime/contracts/pacts/*.json
          if-no-files-found: error
      - name: Remove isolated contract containers
        if: always()
        run: docker compose -f compose.contracts.yml down --volumes --remove-orphans
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build website runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      - name: Build Notifications runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/notifications
          push: false
          cache-from: type=gha,scope=notifications
          cache-to: type=gha,scope=notifications,mode=max
  canonical-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Test raw clone, restart and existing-stack adoption
        run: sh scripts/check-canonical-boot.sh
      - name: Show canonical stack logs
        if: failure()
        run: COMPOSE_PROJECT_NAME=noti-ci-raw docker compose logs --no-color --tail 80
      - name: Remove runner-only test volumes
        if: always()
        run: COMPOSE_PROJECT_NAME=noti-ci-raw docker compose down --volumes --remove-orphans
