name: Notifications checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-transport:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify migration transport on Windows PowerShell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-history-transport.ps1
      - name: Verify probe transport on Windows PowerShell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-probe-transport.ps1
      - name: Verify clean source without Git
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-clean-source.ps1
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/notifications/requirements*.txt
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r services/notifications/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: services/notifications
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: pact_notifications
          POSTGRES_USER: pact
          POSTGRES_PASSWORD: pact-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pact -d pact_notifications"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      PACT_DATABASE_URL: postgresql+psycopg://pact:pact-ci-only@127.0.0.1:5432/pact_notifications
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            contracts/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm ci --prefix contracts
      - run: python -m pip install -r services/notifications/requirements-dev.txt
      # Regenerate from the actual consumer before verifying the actual provider.
      - run: npm run test:contracts
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: notifications-pact
          path: contracts/pacts/*.json
          if-no-files-found: error
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build website runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      - name: Build Notifications runtime
        uses: docker/build-push-action@v6
        with:
          context: services/notifications
          push: false
          cache-from: type=gha,scope=notifications
          cache-to: type=gha,scope=notifications,mode=max
