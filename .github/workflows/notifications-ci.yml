name: Notifications checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: notifications-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  windows-transport:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify migration transport on Windows PowerShell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-history-transport.ps1
      - name: Verify probe transport on Windows PowerShell
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-probe-transport.ps1
      - name: Verify clean source without Git
        run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File test-helpers/check-clean-source.ps1
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: services/notifications/requirements*.txt
      - run: npm ci
      - run: npm test
      - run: python -m pip install -r services/notifications/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: services/notifications
  contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Run Pact with the documented Compose command
        run: docker compose -f compose.contracts.yml run --build --rm contract-tests
      - name: Contract service logs
        if: failure()
        run: docker compose -f compose.contracts.yml logs --no-color --tail 100
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: notifications-pact
          path: runtime/contracts/pacts/*.json
          if-no-files-found: error
      - name: Remove isolated contract containers
        if: always()
        run: docker compose -f compose.contracts.yml down --volumes --remove-orphans
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4.4.1
      - name: Build website runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          target: runtime
          push: false
          cache-from: type=gha,scope=website
          cache-to: type=gha,scope=website,mode=max
      - name: Build Notifications runtime
        uses: docker/build-push-action@v7.4.0
        with:
          context: services/notifications
          push: false
          cache-from: type=gha,scope=notifications
          cache-to: type=gha,scope=notifications,mode=max

