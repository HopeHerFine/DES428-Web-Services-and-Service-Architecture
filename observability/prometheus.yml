global:
  scrape_interval: 10s
scrape_configs:
  - job_name: notifications
    static_configs:
      - targets: ['notifications:8000']
  - job_name: worker
    static_configs:
      - targets: ['notifications-worker:9101']
  - job_name: monolith
    metrics_path: /api/metrics
    static_configs:
      - targets: ['edemand:3000']
